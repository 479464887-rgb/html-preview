<!DOCTYPE html><html lang="en"><head>
<meta property="og:title" content="Html Preview — DevKit">
<meta property="og:description" content="Free online Html Preview tool — fast, simple, and no signup required.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://479464887-rgb.github.io/html-preview/">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://479464887-rgb.github.io/html-preview/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠</text></svg>">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Live HTML/CSS/JS editor with instant preview"><title>HTML Preview — DevKit Tools</title><style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--accent:#58a6ff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:16px;}
.header a{color:var(--text);text-decoration:none;font-size:13px;}
.header a:hover{color:var(--accent);}
.header h1{font-size:16px;color:#f0f6fc;}
.main{display:flex;flex:1;overflow:hidden;}
.editor{flex:1;display:flex;flex-direction:column;min-width:0;}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);}
.tab{padding:8px 16px;font-size:12px;cursor:pointer;color:var(--text);border:none;background:none;border-bottom:2px solid transparent;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.code-area{flex:1;position:relative;}
textarea.code{position:absolute;top:0;left:0;width:100%;height:100%;background:var(--bg);color:var(--text);border:none;padding:16px;font-family:"SF Mono",Menlo,monospace;font-size:13px;resize:none;tab-size:2;}
textarea.code:focus{outline:none;}
.preview{flex:1;border-left:1px solid var(--border);background:#fff;}
.preview iframe{width:100%;height:100%;border:none;}
</style></head><body>
<div class="header"><a href="https://devkit-tools.xyz">← DevKit</a><h1>HTML Preview</h1><button onclick="run()" style="background:#238636;color:#fff;border:none;padding:6px 16px;border-radius:4px;cursor:pointer;font-size:12px;">▶ Run</button></div>
<div class="main">
<div class="editor">
<div class="tabs"><button class="tab active" data-panel="html">HTML</button><button class="tab" data-panel="css">CSS</button><button class="tab" data-panel="js">JS</button></div>
<div class="code-area"><textarea class="code" id="html-code" style="display:block;"><h1>Hello World</h1>
<p>Edit the code and click <strong>Run</strong> to preview.</p>
<button onclick="alert('Clicked!')">Click me</button></textarea>
<textarea class="code" id="css-code" style="display:none;">h1 { color: #58a6ff; font-family: sans-serif; }
p { color: #666; }</textarea>
<textarea class="code" id="js-code" style="display:none;">console.log('JS loaded');</textarea></div>
</div>
<div class="preview"><iframe id="preview-frame"></iframe></div>
</div>
<script>
let active = 'html';
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  active=t.dataset.panel;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.querySelectorAll('.code').forEach(c=>c.style.display='none');
  document.getElementById(active+'-code').style.display='block';
}));
function run(){
  const h=document.getElementById('html-code').value;
  const c=document.getElementById('css-code').value;
  const j=document.getElementById('js-code').value;
  const doc=`<!DOCTYPE html><html><head><style>${c}</style></head><body>${h}<script>${j}<\/script></body></html>`;
  const f=document.getElementById('preview-frame');
  f.srcdoc=doc;
}
run();
</script></body></html>
